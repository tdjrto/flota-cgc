<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
<title>Matrículas Vehículos CGC</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f1f5f9;--bg2:#ffffff;--bg3:#e2e8f0;--card:#ffffff;--border:#e2e8f0;--text:#1e293b;--dim:#64748b;--accent:#3b82f6;--green:#16a34a;--orange:#ea580c;--red:#dc2626;--yellow:#ca8a04;--radius:12px;--shadow:0 2px 8px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.app{min-height:100vh;padding:1rem;max-width:900px;margin:0 auto}
h1{font-size:1.5rem;font-weight:700;margin-bottom:.3rem;color:#0f172a}
.subtitle{color:var(--dim);font-size:.85rem;margin-bottom:1.5rem}

.months{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem}
.month-btn{padding:.7rem 1.2rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);color:var(--dim);font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;text-align:center;line-height:1.3}
.month-btn:hover{background:#cbd5e1;color:#0f172a}
.month-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.month-btn .badge{font-size:.7rem;opacity:.7;margin-left:.3rem}
.month-btn .sub{display:block;font-size:.7rem;font-weight:400;opacity:.7;margin-top:.1rem}

.toolbar{display:flex;gap:.5rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
.btn{padding:.55rem 1rem;border:none;border-radius:var(--radius-sm,8px);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:.4rem}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-edit{background:#e2e8f0;color:#334155}
.btn-edit:hover{background:#cbd5e1}
.btn-edit:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-cancel{background:#e2e8f0;color:#334155}
.btn-cancel:hover{background:#cbd5e1}


.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead{background:var(--bg3)}
th{padding:.7rem .8rem;text-align:left;font-size:.75rem;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.03em}
td{padding:.65rem .8rem;border-top:1px solid var(--border);font-size:.85rem}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:rgba(59,130,246,.06)}
tbody tr.selected{background:rgba(59,130,246,.12);box-shadow:inset 3px 0 0 var(--accent)}
.plate{font-weight:700;color:var(--accent);font-family:monospace;font-size:.9rem}
.amount{font-weight:600;color:var(--green);white-space:nowrap}
.amount.none{color:var(--dim);font-style:italic}
.location{color:var(--dim);font-size:.78rem}
.empty{text-align:center;padding:3rem;color:var(--dim)}

.total-bar{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem;background:#e2e8f0;border-radius:var(--radius);margin-top:.8rem;font-weight:600;color:#0f172a}
.total-bar .val{color:var(--green);font-size:1.1rem}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.2);overflow:hidden}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.2rem;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:1rem;font-weight:700}
.modal-body{padding:1.2rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.75rem;font-weight:600;color:var(--dim);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.02em}
.form-group input,.form-group select{width:100%;padding:.6rem .8rem;border:1px solid var(--border);border-radius:8px;font-size:.88rem;background:var(--bg);color:var(--text);outline:none;transition:border .2s}
.form-group input:focus,.form-group select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,.15)}
.form-check{display:flex;align-items:center;gap:.5rem;margin-top:.5rem}
.form-check input[type=checkbox]{width:auto;accent-color:var(--accent)}
.form-check label{font-size:.85rem;color:var(--text);text-transform:none;letter-spacing:0}
.modal-footer{display:flex;gap:.5rem;justify-content:flex-end;padding:.8rem 1.2rem;border-top:1px solid var(--border);flex-wrap:wrap}
.modal-footer .btn-danger{margin-right:auto}

@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-overlay.open .modal{animation:fadeIn .2s ease}

@media(max-width:600px){
  .app{padding:.8rem}
  h1{font-size:1.2rem}
  .months{gap:.35rem}
  .month-btn{padding:.55rem .8rem;font-size:.8rem}
  table{font-size:.8rem}
  th,td{padding:.5rem .6rem}
  .plate{font-size:.82rem}
  .toolbar{gap:.35rem}
  .btn{padding:.5rem .7rem;font-size:.78rem}
}
</style>
</head>
<body>
<div class="app">
  <h1>🚗 Matrículas Vehículos CGC</h1>
  <p class="subtitle">Listado de placas para pago de matrícula anual</p>
  <div class="months" id="monthTabs"></div>
  <div class="toolbar">
    <button class="btn btn-primary" onclick="openModal()">+ Agregar</button>
    <button class="btn btn-edit" id="btnEdit" disabled onclick="editSelected()">✏️ Editar seleccionado</button>
    <span style="flex:1"></span>
    <button class="btn btn-edit" onclick="exportImage()">📷 Imagen</button>
    <button class="btn btn-edit" onclick="exportExcel()">📊 Excel</button>
    <span id="selectedInfo" style="font-size:.78rem;color:var(--dim);margin-left:.3rem"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Placa</th><th>Vehículo / Motorista</th><th>Ubicación / Tipo</th><th style="text-align:right">Monto</th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div class="total-bar" id="totalBar"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Agregar vehículo</h2>
      <button class="btn btn-cancel" onclick="closeModal()" style="padding:.3rem .6rem;font-size:.9rem">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Placa</label>
        <input type="text" id="fPlate" placeholder="Ej: TCH-7877" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Vehículo / Motorista</label>
        <input type="text" id="fDesc" placeholder="Descripción" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Ubicación</label>
        <select id="fLoc">
          <option value="Comayagua">Comayagua</option>
          <option value="CD SPS">CD SPS</option>
          <option value="Tegucigalpa">Tegucigalpa</option>
          <option value="Rio Blanquito">Rio Blanquito</option>
          <option value="Mina Santa Barbara">Mina Santa Barbara</option>
          <option value="Personales">Personales</option>
          <option value="Plataformas">Plataformas</option>
        </select>
      </div>
      <div class="form-group">
        <label>Monto (L)</label>
        <input type="number" id="fAmount" placeholder="0.00" step="0.01" min="0">
      </div>
      <div class="form-check">
        <input type="checkbox" id="fRemolque">
        <label for="fRemolque">Es remolque (paga en Diciembre)</label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="btnDelete" style="display:none" onclick="deleteVehicle()">🗑️ Eliminar</button>
      <button class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveVehicle()">Guardar</button>
    </div>
  </div>
</div>

<script>
let VEHICLES = [
  {plate:"TCH-7877",amount:2050,loc:"Rio Blanquito",desc:"Tanque Mercedes"},
  {plate:"HDA-3439",amount:2800,loc:"Mina Santa Barbara",desc:"Camion Mina"},
  {plate:"TCJ-1656",amount:2050,loc:"Comayagua",desc:"Volqueta Roja"},
  {plate:"JAN-7330",amount:3050,loc:"Comayagua",desc:"Volqueta Mina"},
  {plate:"JAX-0548",amount:4000,loc:"CD SPS",desc:"Peterbilt blanco"},
  {plate:"TCH-7849",amount:1800,loc:"Tegucigalpa",desc:"Camion Tegus GMC"},
  {plate:"TCH-7857",amount:1800,loc:"Tegucigalpa",desc:"Sabillon"},
  {plate:"HAY-7425",amount:1650,loc:"Tegucigalpa",desc:"Hyundai Azul (Taller)"},
  {plate:"TCH-7447",amount:2050,loc:"Comayagua",desc:"Zorrillo"},
  {plate:"TCH-7419",amount:2050,loc:"Comayagua",desc:"Nelsy Velasquez"},
  {plate:"TCH-7489",amount:2050,loc:"Comayagua",desc:"Cabezal Alejandro"},

  {plate:"JAS-1758",amount:3600,loc:"Comayagua",desc:"Ramon Machado"},
  {plate:"JAS-2215",amount:4847.98,loc:"Comayagua",desc:"Nelsy Martinez (cabezal Eduardo)"},
  {plate:"AAG-9404",amount:0,loc:"Comayagua",desc:"Mack Negro"},
  {plate:"HDW-3697",amount:6648.38,loc:"Comayagua",desc:"Amilcar"},
  {plate:"JDE-1120",amount:4665.32,loc:"Comayagua",desc:"Fredy Castillo"},
  {plate:"JAX-6021",amount:3900,loc:"Comayagua",desc:"Leonidas Martinez"},
  {plate:"JDH-5459",amount:6011.18,loc:"Comayagua",desc:"Jorge Reyes"},
  {plate:"HCO-7418",amount:4432.76,loc:"Comayagua",desc:"Julio Lagos (Leticia Gonzalez)"},
  {plate:"TCH-7322",amount:3410,loc:"Comayagua",desc:"Felix Reyes (Junior Posadas)"},
  {plate:"TCH-7856",amount:2050,loc:"Comayagua",desc:"Camion Wilmer"},
  {plate:"HAU-3889",amount:8340,loc:"Comayagua",desc:"Camion ARGOS"},
  {plate:"HBC-6792",amount:4150,loc:"Comayagua",desc:"Volqueta Blanca"},
  {plate:"JAI-2886",amount:3850,loc:"Comayagua",desc:"Camion Genaro"},
  {plate:"TCH-4445",amount:2500,loc:"Comayagua",desc:"Camion verde"},
  {plate:"HDU-3985",amount:2700,loc:"Comayagua",desc:"Chevrolet Blazer"},
  {plate:"HCC-2948",amount:1638,loc:"Comayagua",desc:"Isuzu KB"},
  {plate:"JAR-9668",amount:5018.21,loc:"Personales",desc:"Ford blanca F150"},
  {plate:"JDD-3021",amount:6122.21,loc:"Personales",desc:"Ford Raptor negra"},
  {plate:"HDN-5290",amount:2990,loc:"Personales",desc:"Ford Escape azul (Eduardo)"},
  {plate:"HAY-5023",amount:2990,loc:"Personales",desc:"Corolla Beige (era de Eduardo)"},
  {plate:"HDG-4325",amount:4404.13,loc:"Personales",desc:"Kia Sorento de Genesis"},
  {plate:"TRB-4247",amount:2000,loc:"Plataformas",desc:"Rastra de TCH-7447 (zorrillo)",remolque:true},
  {plate:"TRB-4204",amount:2000,loc:"Plataformas",desc:"Rastra de TCH-7419 (Nelsy hijo)",remolque:true},
  {plate:"TRB-4211",amount:2000,loc:"Plataformas",desc:"Rastra de TCH-7876 (Reinaldo Castro)",remolque:true},
  {plate:"TRB-4062",amount:2000,loc:"Plataformas",desc:"Rastra de TCH-6895 (Leonidas Martinez)",remolque:true},
  {plate:"TRB-4241",amount:2000,loc:"Plataformas",desc:"Rastra de HCO-7419 (Genesis Andrade)",remolque:true},
  {plate:"TRB-4331",amount:2000,loc:"Plataformas",desc:"Rastra de JAD-0599 (Omar Castillo)",remolque:true},
  {plate:"TRB-4231",amount:2000,loc:"Plataformas",desc:"Rastra de HAY-6574 (Mercedes Jiron)",remolque:true},
  {plate:"TRC-1085",amount:4000,loc:"Plataformas",desc:"Rastra de TCH-7489 (Alejandro Gonzalez)",remolque:true},
  {plate:"TRB-4164",amount:1121,loc:"Plataformas",desc:"Rastra de HCO-7418 (Leticia Gonzalez)",remolque:true},
  {plate:"TRB-4217",amount:2360,loc:"Plataformas",desc:"Rastra de TCH-7322 (Junior Posadas)",remolque:true},
  {plate:"TRB-4208",amount:2000,loc:"Plataformas",desc:"Low Boy",remolque:true},
  {plate:"TRA-1640",amount:4000,loc:"Plataformas",desc:"Cama Baja",remolque:true},
  {plate:"TRB-6162",amount:2000,loc:"Plataformas",desc:"Traileta azul",remolque:true},
  {plate:"TRC-7781",amount:2000,loc:"Plataformas",desc:"Vagon de las llantas",remolque:true},
  {plate:"TRB-9728",amount:2000,loc:"Plataformas",desc:"Rastra vendida y devuelta (uso Leonidas)",remolque:true},
  {plate:"TRB-4028",amount:2000,loc:"Plataformas",desc:"Rastra Azul (comprada a Munguia)",remolque:true},
  {plate:"TRA-8275",amount:1121,loc:"Plataformas",desc:"Rastra Verde (comprada a Erik)",remolque:true}
];

const DEFAULT_VEHICLES = JSON.parse(JSON.stringify(VEHICLES));
const STORAGE_KEY = "matriculas_vehicles_2026";
const MONTHS = [
  {id:"all",label:"Todos",color:"#3b82f6",sub:""},
  {id:"jul",label:"Julio",month:6,ends:[0,1],color:"#22c55e",sub:"Terminación 0, 1"},
  {id:"ago",label:"Agosto",month:7,ends:[2,3],color:"#f97316",sub:"Terminación 2, 3"},
  {id:"sep",label:"Septiembre",month:8,ends:[4,5],color:"#eab308",sub:"Terminación 4, 5"},
  {id:"oct",label:"Octubre",month:9,ends:[6,7],color:"#ef4444",sub:"Terminación 6, 7"},
  {id:"nov",label:"Noviembre",month:10,ends:[8,9],color:"#a855f7",sub:"Terminación 8, 9"},
  {id:"dic",label:"Diciembre",month:11,remolques:true,color:"#06b6d4",sub:"Remolques"}
];

let activeMonth = "all";
let selectedIdx = -1;
let editIdx = -1;

function loadVehicles() {
  try { const d = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (Array.isArray(d) && d.length) VEHICLES = d; } catch(e) {}
}
function saveVehicles() { localStorage.setItem(STORAGE_KEY, JSON.stringify(VEHICLES)); }

function getMonth(v) {
  if (v.remolque) return "dic";
  const last = v.plate ? parseInt(v.plate.slice(-1)) : -1;
  if (last === 0 || last === 1) return "jul";
  if (last === 2 || last === 3) return "ago";
  if (last === 4 || last === 5) return "sep";
  if (last === 6 || last === 7) return "oct";
  if (last === 8 || last === 9) return "nov";
  return "none";
}

function fmt(n) { return n ? "L " + n.toLocaleString("es-HN",{minimumFractionDigits:2,maximumFractionDigits:2}) : "—"; }

function getFiltered() {
  return activeMonth === "all" ? VEHICLES : VEHICLES.filter(v => getMonth(v) === activeMonth);
}

function render() {
  const filtered = getFiltered();
  const total = filtered.reduce((s,v) => s + (v.amount || 0), 0);

  document.getElementById("monthTabs").innerHTML = MONTHS.map(m => {
    const count = m.id === "all" ? VEHICLES.length : VEHICLES.filter(v => getMonth(v) === m.id).length;
    return `<div class="month-btn ${activeMonth===m.id?'active':''}" style="${activeMonth===m.id?'background:'+m.color+';border-color:'+m.color:''}" onclick="activeMonth='${m.id}';selectedIdx=-1;render()"><span>${m.label}<span class="badge">${count}</span></span><span class="sub">${m.sub}</span></div>`;
  }).join("");

  document.getElementById("tableBody").innerHTML = filtered.length ? filtered.map((v,i) => {
    const realIdx = VEHICLES.indexOf(v);
    const sel = realIdx === selectedIdx ? ' selected' : '';
    return `<tr class="${sel}" onclick="selectRow(${realIdx})">
      <td class="plate">${v.plate || "S/N"}</td>
      <td>${v.desc}</td>
      <td class="location">${v.loc}</td>
      <td style="text-align:right" class="amount ${v.amount?'':'none'}">${fmt(v.amount)}</td>
    </tr>`;
  }).join("") : '<tr><td colspan="4" class="empty">Sin vehículos para este mes</td></tr>';

  document.getElementById("totalBar").innerHTML = `<span>Total ${MONTHS.find(m=>m.id===activeMonth)?.label || 'Todos'} (${filtered.length} vehículos)</span><span class="val">${fmt(total)}</span>`;

  const btnEdit = document.getElementById("btnEdit");
  const info = document.getElementById("selectedInfo");
  if (selectedIdx >= 0 && selectedIdx < VEHICLES.length) {
    btnEdit.disabled = false;
    info.textContent = `Seleccionado: ${VEHICLES[selectedIdx].plate || 'S/N'} — ${VEHICLES[selectedIdx].desc}`;
  } else {
    btnEdit.disabled = true;
    info.textContent = '';
  }
}

function selectRow(idx) {
  selectedIdx = selectedIdx === idx ? -1 : idx;
  render();
}

function editSelected() {
  if (selectedIdx < 0 || selectedIdx >= VEHICLES.length) return;
  editIdx = selectedIdx;
  const v = VEHICLES[editIdx];
  document.getElementById("modalTitle").textContent = "Editar vehículo";
  document.getElementById("fPlate").value = v.plate || "";
  document.getElementById("fDesc").value = v.desc || "";
  document.getElementById("fLoc").value = v.loc || "Comayagua";
  document.getElementById("fAmount").value = v.amount || "";
  document.getElementById("fRemolque").checked = !!v.remolque;
  document.getElementById("btnDelete").style.display = "inline-flex";
  document.getElementById("modalOverlay").classList.add("open");
}

function openModal() {
  editIdx = -1;
  document.getElementById("modalTitle").textContent = "Agregar vehículo";
  document.getElementById("fPlate").value = "";
  document.getElementById("fDesc").value = "";
  document.getElementById("fLoc").value = "Comayagua";
  document.getElementById("fAmount").value = "";
  document.getElementById("fRemolque").checked = false;
  document.getElementById("btnDelete").style.display = "none";
  document.getElementById("modalOverlay").classList.add("open");
  document.getElementById("fPlate").focus();
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
}

function saveVehicle() {
  const plate = document.getElementById("fPlate").value.trim().toUpperCase();
  const desc = document.getElementById("fDesc").value.trim();
  const loc = document.getElementById("fLoc").value;
  const amount = parseFloat(document.getElementById("fAmount").value) || 0;
  const remolque = document.getElementById("fRemolque").checked;

  if (!plate && !desc) { alert("Ingresa al menos la placa o la descripción"); return; }

  const vehicle = { plate, amount, loc, desc, remolque };

  if (editIdx >= 0) {
    VEHICLES[editIdx] = vehicle;
  } else {
    VEHICLES.push(vehicle);
  }

  saveVehicles();
  selectedIdx = VEHICLES.indexOf(vehicle);
  closeModal();
  render();
}

function deleteVehicle() {
  if (editIdx < 0) return;
  const v = VEHICLES[editIdx];
  if (!confirm(`¿Eliminar ${v.plate || 'S/N'} — ${v.desc}?`)) return;
  VEHICLES.splice(editIdx, 1);
  selectedIdx = -1;
  saveVehicles();
  closeModal();
  render();
}

function exportImage() {
  const filtered = getFiltered();
  const total = filtered.reduce((s,v) => s + (v.amount || 0), 0);
  const monthLabel = MONTHS.find(m => m.id === activeMonth)?.label || 'Todos';
  const padding = 30;
  const colW = [110, 280, 160, 120];
  const rowH = 32;
  const headerH = 38;
  const titleH = 50;
  const totalH = 42;
  const w = padding * 2 + colW.reduce((a,b) => a+b, 0);
  const h = padding + titleH + headerH + filtered.length * rowH + totalH + padding;

  const c = document.createElement('canvas');
  c.width = w * 2; c.height = h * 2;
  const ctx = c.getContext('2d');
  ctx.scale(2, 2);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);

  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 16px -apple-system, sans-serif';
  ctx.fillText('🚗 Matrículas Vehículos CGC', padding, padding + 22);
  ctx.font = '12px -apple-system, sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.fillText(`Filtro: ${monthLabel} — ${filtered.length} vehículos`, padding, padding + 40);

  let y = padding + titleH;
  ctx.fillStyle = '#e2e8f0';
  ctx.fillRect(padding, y, w - padding * 2, headerH);
  ctx.fillStyle = '#64748b';
  ctx.font = 'bold 10px -apple-system, sans-serif';
  const headers = ['PLACA', 'VEHÍCULO / MOTORISTA', 'UBICACIÓN / TIPO', 'MONTO'];
  let x = padding + 8;
  headers.forEach((h, i) => {
    ctx.fillText(h, x, y + 24);
    x += colW[i];
  });
  y += headerH;

  ctx.font = '11px monospace';
  filtered.forEach((v, i) => {
    if (i % 2 === 0) { ctx.fillStyle = '#f8fafc'; ctx.fillRect(padding, y, w - padding * 2, rowH); }
    ctx.fillStyle = '#3b82f6';
    ctx.fillText(v.plate || 'S/N', padding + 8, y + 21);
    ctx.fillStyle = '#1e293b';
    ctx.font = '11px -apple-system, sans-serif';
    ctx.fillText(v.desc || '', padding + colW[0] + 8, y + 21);
    ctx.fillStyle = '#64748b';
    ctx.fillText(v.loc || '', padding + colW[0] + colW[1] + 8, y + 21);
    ctx.fillStyle = v.amount ? '#16a34a' : '#94a3b8';
    ctx.font = '11px -apple-system, sans-serif';
    const amtText = v.amount ? 'L ' + v.amount.toLocaleString('es-HN', {minimumFractionDigits:2, maximumFractionDigits:2}) : '—';
    ctx.fillText(amtText, padding + colW[0] + colW[1] + colW[2] + 8, y + 21);
    ctx.font = '11px monospace';
    y += rowH;
  });

  ctx.fillStyle = '#e2e8f0';
  ctx.fillRect(padding, y, w - padding * 2, totalH);
  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 12px -apple-system, sans-serif';
  ctx.fillText(`Total ${monthLabel} (${filtered.length} vehículos)`, padding + 8, y + 26);
  ctx.fillStyle = '#16a34a';
  ctx.font = 'bold 14px -apple-system, sans-serif';
  const totalText = 'L ' + total.toLocaleString('es-HN', {minimumFractionDigits:2, maximumFractionDigits:2});
  ctx.fillText(totalText, w - padding - ctx.measureText(totalText).width - 8, y + 27);

  const link = document.createElement('a');
  link.download = `matriculas_${monthLabel.toLowerCase()}.png`;
  link.href = c.toDataURL('image/png');
  link.click();
}

function exportExcel() {
  const filtered = getFiltered();
  const total = filtered.reduce((s,v) => s + (v.amount || 0), 0);
  const monthLabel = MONTHS.find(m => m.id === activeMonth)?.label || 'Todos';

  const data = [
    ['🚗 Matrículas Vehículos CGC'],
    [`Filtro: ${monthLabel} — ${filtered.length} vehículos`],
    [],
    ['Placa', 'Vehículo / Motorista', 'Ubicación / Tipo', 'Monto (L)']
  ];
  filtered.forEach(v => {
    data.push([v.plate || 'S/N', v.desc || '', v.loc || '', v.amount || 0]);
  });
  data.push([]);
  data.push(['', '', `Total ${monthLabel} (${filtered.length} vehículos)`, total]);

  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{wch:12},{wch:38},{wch:20},{wch:15}];
  const range = XLSX.utils.decode_range(ws['!ref']);
  ws['!merges'] = [{s:{r:0,c:0},e:{r:0,c:3}}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, monthLabel);
  XLSX.writeFile(wb, `matriculas_${monthLabel.toLowerCase()}.xlsx`);
}

loadVehicles();
render();
</script>
</body>
